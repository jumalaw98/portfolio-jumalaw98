# ──────────────────────────────────────────────────────────────────
# Dependabot Auto-merge
# ──────────────────────────────────────────────────────────────────
# Automatically merges Dependabot PRs that meet ALL of these criteria:
#   1. Actor is dependabot[bot] (never runs on human PRs)
#   2. Update type is patch or minor (major bumps always need review)
#   3. All required CI checks have passed (enforced via --auto flag)
#
# Security model:
#   - contents: write   — required to merge the PR
#   - pull-requests: write — required to approve and merge
#   - Explicit permissions set omitted scopes to none
#   - GITHUB_TOKEN is used, not a PAT — scoped to this repo only
#   - Major version updates are explicitly blocked; they open a PR
#     but require a human to review and merge.
#
# How it works:
#   gh pr merge --auto --squash queues the merge to happen as soon
#   as all required branch-protection checks pass. If CI is still
#   running, GitHub will wait and merge once it goes green.
#   If CI fails, the auto-merge is cancelled — nothing is force-merged.
# ──────────────────────────────────────────────────────────────────

name: Dependabot Auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    name: Fetch Dependabot metadata
    runs-on: ubuntu-latest
    # Only run when Dependabot opened the PR — never on human PRs.
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
      old-version: ${{ steps.metadata.outputs.old-version }}
      new-version: ${{ steps.metadata.outputs.new-version }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Extract the update-type from the PR labels that Dependabot applies.
        # Dependabot adds labels like "dependencies" and the PR title encodes
        # the semver bump type. We use the native `gh` CLI (pre-installed on
        # ubuntu-latest runners) instead of a third-party action to avoid
        # exposing GITHUB_TOKEN to external code.
        # Returns e.g. "version-update:semver-patch" or "version-update:semver-major".
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          LABELS=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name' 2>/dev/null || echo "")

          # Determine update type from PR title (Dependabot PR titles follow
          # the pattern "bump <dep> from <old> to <new>")
          # Use gh pr view to safely read the title without interpolating
          # event data into the shell, avoiding injection via metacharacters.
          TITLE=$(gh pr view "$PR_URL" --json title --jq '.title')
          if echo "$TITLE" | grep -qE 'bump .+ from [0-9]+\.[0-9]+\.[0-9]+ to [0-9]+\.[0-9]+\.[0-9]+'; then
            # Extract old and new versions from the title
            OLD_VERSION=$(echo "$TITLE" | sed -n 's/.*from \([0-9]*\.[0-9]*\.[0-9]*\) to .*/\1/p')
            NEW_VERSION=$(echo "$TITLE" | sed -n 's/.*to \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p')

            OLD_MAJOR=$(echo "$OLD_VERSION" | cut -d. -f1)
            OLD_MINOR=$(echo "$OLD_VERSION" | cut -d. -f2)
            NEW_MAJOR=$(echo "$NEW_VERSION" | cut -d. -f1)
            NEW_MINOR=$(echo "$NEW_VERSION" | cut -d. -f2)

            if [ "$OLD_MAJOR" != "$NEW_MAJOR" ]; then
              UPDATE_TYPE="version-update:semver-major"
            elif [ "$OLD_MINOR" != "$NEW_MINOR" ]; then
              UPDATE_TYPE="version-update:semver-minor"
            else
              UPDATE_TYPE="version-update:semver-patch"
            fi
          else
            UPDATE_TYPE="unknown"
          fi

          echo "update-type=${UPDATE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "old-version=${OLD_VERSION:-}" >> "$GITHUB_OUTPUT"
          echo "new-version=${NEW_VERSION:-}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  automerge:
    name: Auto-merge patch / minor updates
    runs-on: ubuntu-latest
    needs: metadata
    # Only run when Dependabot opened the PR — never on human PRs.
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Auto-merge patch updates
        id: auto-merge-patch
        # Patch bumps (0.0.x) are the lowest risk — auto-merge unconditionally
        # once CI passes.
        if: needs.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge minor updates (stable deps only)
        id: auto-merge-minor
        # Minor bumps (0.x.0) add new features but must not break existing APIs
        # per semver. However, pre-1.0 (0.x) packages can make breaking changes
        # in minor releases, so we only auto-merge minor bumps for stable (>=1.0)
        # dependencies. 0.x minor updates require manual review.
        if: needs.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          OLD_VERSION="${{ needs.metadata.outputs.old-version }}"
          NEW_VERSION="${{ needs.metadata.outputs.new-version }}"
          OLD_MAJOR=$(echo "$OLD_VERSION" | cut -d. -f1)

          if [ "$OLD_MAJOR" = "0" ]; then
            echo "⚠️  Pre-1.0 dependency minor update ($OLD_VERSION → $NEW_VERSION) — skipping auto-merge."
            echo "0.x packages may introduce breaking changes in minor releases."
            echo "PR requires manual review: $PR_URL"
            exit 0
          fi

          echo "Stable minor update detected ($OLD_VERSION → $NEW_VERSION) — queuing auto-merge after CI passes."
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip major updates
        # Major bumps (x.0.0) may have breaking changes — always require
        # human review. Log clearly so the PR is not silently ignored.
        if: needs.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          echo "⚠️  Major version update detected — skipping auto-merge."
          echo "PR requires manual review: $PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          UPDATE_TYPE="${{ needs.metadata.outputs.update-type }}"
          METADATA_RESULT="${{ needs.metadata.result }}"
          PATCH_RESULT="${{ steps.auto-merge-patch.outcome }}"
          MINOR_RESULT="${{ steps.auto-merge-minor.outcome }}"
          ACTION="❌ Not queued — metadata unavailable"

          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            ACTION="⚠️ Skipped — manual review required"
          elif [[ "$UPDATE_TYPE" == "version-update:semver-patch" && "$PATCH_RESULT" == "success" ]]; then
            ACTION="✅ Queued for auto-merge after CI"
          elif [[ "$UPDATE_TYPE" == "version-update:semver-minor" && "$MINOR_RESULT" == "success" ]]; then
            ACTION="✅ Queued for auto-merge after CI"
          elif [[ "$METADATA_RESULT" == "success" ]]; then
            ACTION="❌ Not queued — auto-merge step did not complete"
          fi

          {
            echo "## 🤖 Dependabot Auto-merge"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Update type | \`${UPDATE_TYPE}\` |"
            echo "| Action | ${ACTION} |"
          } >> "$GITHUB_STEP_SUMMARY"
