name: Draft Summary

on:
  push:
    branches: [main]
    paths: ["src/content/blog/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      # checkout is required before referencing any local composite action
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: ./.github/actions/gate
        with:
          node-version: "24"

      # Generate summaries for posts that need them
      - name: Generate summaries
        id: generate
        run: |
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          npx --no-install tsx scripts/generate-summaries.ts >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # Create PR if any files changed
      - name: Create Pull Request
        if: steps.generate.outputs.changes != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-generate summary hooks"
          title: "chore: auto-generated summary hooks"
          body: |
            This PR was automatically created by the Draft Summary workflow.

            Posts updated:
            ```
            ${{ steps.generate.outputs.changes }}
            ```

            Please review the generated summaries before merging.
          branch: bot/generated-summary
          delete-branch: true
          reviewers: jumalaw98
