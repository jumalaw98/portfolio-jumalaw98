# ──────────────────────────────────────────────────────────────────
# Security — Supply chain & secret scanning
# ──────────────────────────────────────────────────────────────────
# Runs on PRs to main. Supplements the existing `audit` job in ci.yml.
#
# Jobs:
#   1. dependency-review — flags newly introduced vulnerable packages
#                          and enforces license policy (denies GPL/AGPL)
#   2. secret-scan      — detects accidentally committed secrets via Gitleaks
# ──────────────────────────────────────────────────────────────────

name: Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"

jobs:
  # ── Dependency Review ─────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # needed for dependency-review annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Dependency Review — No new vulnerabilities"
            echo ""
            echo "All newly introduced dependencies passed review."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Secret Scanning ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Secret Scan — No secrets found"
            echo ""
            echo "Gitleaks scan completed with verified results only."
          } >> "$GITHUB_STEP_SUMMARY"
