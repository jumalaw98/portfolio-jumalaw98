# ──────────────────────────────────────────────────────────────────
# CodeQL — GitHub-Native Security Analysis
# ──────────────────────────────────────────────────────────────────
# Runs on:
#   - Every PR to main (fast feedback on new vulnerabilities)
#   - Every push to main (baseline scan)
#   - Weekly schedule (catch vulnerabilities in existing code)
#
# Why separate from ci.yml:
#   CodeQL is slower (~3 min) and has different failure semantics.
#   It is informational (not a required status check) to avoid
#   blocking merges on false positives or noisy results.
#
# Best practice: keep fail-fast: false so all languages are scanned
# even if one fails.
# ──────────────────────────────────────────────────────────────────

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 08:00 UTC — catch issues over the weekend
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Deny all permissions by default; the analyze job grants only what it needs.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false # always complete all languages even if one fails
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Use a config file if you need custom query suites or paths:
          # config-file: ./.github/codeql/codeql-config.yml
          # queries: security-extended,security-and-quality

      - name: Build
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/next build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          upload: True
          output: codeql-results

      - name: Upload SARIF (if analysis fails)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results/
          retention-days: 7
