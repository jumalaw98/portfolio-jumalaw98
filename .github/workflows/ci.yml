# ──────────────────────────────────────────────────────────────────
# CI — Pull Request Quality Gates
# ──────────────────────────────────────────────────────────────────
# Triggers on every PR to `main` and on direct pushes (merge queue).
#
# Architecture:
#   Tier 1 (parallel): code-quality, type-check, audit
#   Tier 2 (serial):   build (needs Tier 1)
#   Tier 3 (serial):   bundle-size (needs build)
#
# Required for branch protection: code-quality, type-check, audit, build
# Informational only: bundle-size (bundle bloat should not block PRs)
# ──────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default: every job gets read-only token access unless
# it declares a narrower or broader override inline.
permissions:
  contents: read

# ── Concurrency ──────────────────────────────────────────────────
# Cancel in-progress runs for the same branch/PR. New commits →
# old runs stop immediately, saving minutes for fast feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ── Global defaults ──────────────────────────────────────────────
defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://jumalaw98.vercel.app' }}
  NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN || 'jumalaw98.vercel.app' }}

jobs:
  # ────────────────────────────────────────────────────────────────
  # TIER 1 — Parallel static analysis
  # ────────────────────────────────────────────────────────────────

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        # --ignore-scripts prevents lifecycle hooks (postinstall etc.) in
        # third-party packages from executing arbitrary code on the runner.
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Code Quality Passed"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| ESLint | ✅ |"
            echo "| Prettier | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"

  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npm run typecheck

      - name: Summary
        if: success()
        run: echo "## ✅ TypeScript — no errors" >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for unexpected lockfile changes
        # If the lockfile is out of sync with package.json, `npm ci` would have
        # already failed above. This step adds an explicit git-level check:
        # if running npm install would produce any diff in package-lock.json,
        # the lockfile was committed in a dirty state.
        run: |
          npm install --package-lock-only --ignore-scripts --quiet
          if ! git diff --quiet package-lock.json; then
            echo "❌ package-lock.json is out of sync with package.json."
            echo "Run 'npm install' locally and commit the updated lockfile."
            git diff package-lock.json
            exit 1
          fi
          echo "✅ package-lock.json is in sync with package.json."

      - name: npm audit
        # --audit-level=high → fails the job on any high/critical severity finding,
        # blocking the PR before it can reach the build step.
        run: npm audit --audit-level=high

      - name: Summary
        if: success()
        run: |
          {
            echo "## 🔒 Dependency Audit — ✅ Passed"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Lockfile integrity | ✅ In sync |"
            echo "| npm audit (high+) | ✅ No vulnerabilities |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────
  # TIER 2 — Build (depends on Tier 1)
  # ────────────────────────────────────────────────────────────────

  build:
    name: Build
    needs: [code-quality, type-check, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          # Key includes lockfile + all source files that affect output
          key: nextjs-build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx,mjs,mts,cjs,cts,css,json}') }}
          restore-keys: |
            nextjs-build-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        # --ignore-scripts blocks postinstall hooks in deps at install time.
        # The build itself is invoked directly via node_modules/.bin/next,
        # not through npm run, so this does not affect the Next.js build.
        run: npm ci --ignore-scripts

      - name: Build application
        # Use Next.js directly, not `npm run build`,
        # because our build script chains lint + type-check
        # which are already covered by upstream jobs.
        run: ./node_modules/.bin/next build

      - name: Summary
        if: success()
        run: |
          {
            echo "## ✅ Build Succeeded"
            echo ""
            echo "The application compiled successfully with Next.js 16 (Turbopack)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist build output for downstream jobs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build-output
          path: |
            .next
            !.next/cache
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # TIER 3 — Bundle analysis (depends on build)
  # ────────────────────────────────────────────────────────────────

  bundle-size:
    name: Bundle Size
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build with bundle analyzer
        run: npm run analyze
        env:
          ANALYZE: "true"

      - name: Upload bundle report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-report
          path: .next/analyze/
          retention-days: 30

      - name: Summary
        if: success()
        run: |
          {
            echo "## 📦 Bundle Analysis Complete"
            echo ""
            echo "Bundle report uploaded as an artifact. Download \`bundle-report\`"
            echo "to inspect per-route JavaScript bundle sizes."
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Analyzer | @next/bundle-analyzer |"
            echo "| Build mode | \`ANALYZE=true\` |"
          } >> "$GITHUB_STEP_SUMMARY"
